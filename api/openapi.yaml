openapi: 3.1.0
info:
  title: TerraFlow API
  version: 0.0.0
  description: >
    Contract between the TerraFlow Go backend and the React frontend. Source of
    truth: the Go server and the TS client are generated from this file. Phase 0
    is a stub; endpoints are filled in from Phase 2 (see docs/08-dev-plan.md).
servers:
  - url: /api
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
  # Phase 2 adds: GET /me, GET /projects, GET /projects/{id}/graph
components: {}
