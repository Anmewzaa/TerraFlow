openapi: 3.1.0
info:
  title: TerraFlow API
  version: 0.6.0
  description: >
    Contract between the TerraFlow Go backend and the React frontend. Source of
    truth: the Go server and the TS client are generated from this file.
servers:
  - url: /api
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
  /projects/{id}/changesets:
    get:
      summary: List changesets for a project
      operationId: listChangesets
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Changeset" }
    post:
      summary: Create a new draft changeset
      operationId: createChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                env: { type: string }
                title: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
  /projects/{id}/changesets/{csId}:
    get:
      summary: Get a changeset
      operationId: getChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changeset" }
    put:
      summary: Save changeset canvas (auto-save)
      operationId: saveChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanvasState" }
      responses:
        "200":
          description: Saved
    delete:
      summary: Delete a draft changeset
      operationId: deleteChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
  /projects/{id}/changesets/{csId}/versions:
    post:
      summary: Save a version of a draft
      description: Snapshots the draft's canvas as a new changeset with status `saved`. The draft stays the working copy. A blank title becomes "Version N". A saved version is sent for review with `publish`.
      operationId: saveChangesetVersion
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        "201":
          description: "{id, title} of the saved version"
        "404":
          description: Not found, or not a draft
  /projects/{id}/changesets/{csId}/publish:
    post:
      summary: Publish a draft or a saved version for review
      operationId: publishChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
              required: [title]
      responses:
        "200":
          description: Published
        "422":
          description: The canvas has errors (D-065). Body {error, findings[]}; the same check runs on approve.
        "409":
          description: Another changeset of this project is still waiting for review; decide it first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  pending:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
  /projects/{id}/changesets/{csId}/preview:
    get:
      summary: Preview generated HCL for a changeset
      operationId: previewChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Generated HCL files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateOutput" }
  /projects:
    get:
      summary: Projects the signed-in user can open
      description: Admins (Entra devops group) see every project; everyone else sees only the projects an admin assigned to them (D-032).
      operationId: listProjects
      responses:
        "200":
          description: Projects, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      summary: Create a project (admin)
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                iac_path:
                  type: string
                  description: Optional existing folder inside the server workspace. Omitted = create workspace/<slug>.
              required: [name]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { description: Invalid name, description or iac_path outside the workspace }
        "403": { description: Needs the admin role }
        "409": { description: A project with this name already exists }
  /projects/{id}:
    patch:
      summary: Rename or re-describe a project, or change its folder (admin)
      description: The slug never changes, so branch names and links stay stable.
      operationId: updateProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                iac_path: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { description: Invalid field, or nothing to update }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
    delete:
      summary: Delete a project from the app (admin)
      description: Removes the project, its drafts, changesets and member list. Repository files and the audit log are kept. Changesets waiting for review make this a 409 unless force=true.
      operationId: deleteProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
        "409":
          description: Changesets are waiting for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  pending_changesets: { type: integer }
  /projects/{id}/validate:
    post:
      summary: Check a canvas and answer the findings; changes nothing (D-065)
      description: Body is a canvas {nodes, edges} (at most 2 MiB). The answer is {findings:[{severity, node?, field?, rule, message, structural?}]}. Structural findings are input that save refuses (422); errors block publish and approve; warnings do not. A value that cannot be evaluated (a reference, a project variable) is skipped, never judged.
      operationId: validateCanvas
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{findings}" }
        "400": { description: Not JSON, or not shaped like a canvas }
        "413": { description: The canvas is larger than 2 MiB }
  /projects/{id}/import:
    get:
      summary: Module calls already in the project, as canvas nodes
      description: Read-only. Each node carries `existing` (folder, file, label) so editing it replaces only that block (D-036). Literal arguments come back as values; references such as var.x or module.a.id come back as `{"$expr": "<text>"}` so they are not frozen into literals when the node is edited.
      operationId: importProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The module calls found
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/CanvasNode" }
        "404": { description: Unknown project, or not a member }
        "422": { description: A .tf file in the project does not parse }
  /projects/{id}/members:
    get:
      summary: Users assigned to the project (admin)
      operationId: listMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Members, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
    put:
      summary: Replace the project's member list (admin)
      description: All-or-nothing. A user must have signed in once before they can be assigned.
      operationId: setMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_oids: { type: array, items: { type: string } }
              required: [user_oids]
      responses:
        "200":
          description: The new member list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "400": { description: Missing or empty user_oids value }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
        "422": { description: A user has never signed in }
  /projects/{id}/component-config:
    get:
      summary: App-side settings (such as colours) of the project's components
      operationId: listComponentConfig
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Settings, by address
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComponentConfig" }
        "404": { description: Not found or not a member }
    put:
      summary: Set or clear one component's colour
      description: An empty color removes the setting.
      operationId: setComponentConfig
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                address: { type: string, description: "<folder>/<module label>" }
                color: { type: string, description: Short lowercase colour key, or empty to clear. }
              required: [address, color]
      responses:
        "200": { description: Saved }
        "400": { description: Invalid address or colour }
        "404": { description: Not found or not a member }
  /catalog/resources:
    get:
      summary: Raw resources an admin prepared (D-041)
      description: A raw resource is a plain `resource` block such as azurerm_resource_group, not a module. Developers place it on the canvas; its default values are only a starting point.
      operationId: listRawResources
      responses:
        "200":
          description: Templates, by title
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RawResource" }
  /admin/resources:
    post:
      summary: Add a raw resource (admin)
      operationId: createRawResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawResourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawResource" }
        "400": { description: Invalid name, title, resource_type, folder or body }
        "403": { description: Needs the admin role }
        "409": { description: A raw resource with this name already exists }
  /admin/resources/{name}:
    put:
      summary: Replace a raw resource's fields (admin); the name never changes
      operationId: updateRawResource
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawResourceInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawResource" }
        "400": { description: Invalid field or body }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
    delete:
      summary: Delete a raw resource (admin)
      description: Nodes already on a canvas keep working; they carry their own type and values.
      operationId: deleteRawResource
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
  /dev/users:
    get:
      summary: Local sign-in only (auth disabled) - who can be picked and who is signed in
      description: 404 when the local sign-in is off. POST /dev/login {oid} sets the cookie, POST /dev/logout clears it; without the cookie every other call is 401.
      operationId: listDevUsers
      responses:
        "200": { description: "{enabled, current, users[{oid,email,name,role,note}]}" }
        "404": { description: The local sign-in is not on }
  /admin/audit:
    get:
      summary: Everything that was done, across projects and module management (admin)
      operationId: listAuditAll
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 500 } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    user_oid: { type: string }
                    action: { type: string }
                    resource: { type: string }
                    detail: { type: object }
                    created_at: { type: string, format: date-time }
        "403": { description: Needs the admin role }
  /catalog/providers:
    get:
      summary: The registered cloud providers (D-058)
      operationId: listProviders
      responses:
        "200": { description: "[{id, name, source, logo (data URI), versions[], block, updated_at}]" }
  /catalog/meta:
    get:
      summary: The palette categories, in display order
      operationId: catalogMeta
      responses:
        "200": { description: "{categories: [{id, label}]}" }
  /admin/providers:
    post:
      summary: Register a cloud provider (admin)
      operationId: createProvider
      responses:
        "201": { description: The provider }
        "400": { description: Invalid id, name, source, logo (PNG or SVG data URI up to 40 KB) or version constraint }
        "409": { description: The id is taken }
  /admin/providers/{id}:
    put:
      summary: Change a provider (admin); the id never changes
      operationId: updateProvider
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The provider }
        "404": { description: Not found }
    delete:
      summary: Delete a provider that no raw resource uses (admin)
      operationId: deleteProvider
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409": { description: Raw resources still use it }
  /admin/projects/overview:
    get:
      summary: Every project with its owner, repository, connection state, member count and pending changes (admin; metadata only, no project content)
      operationId: adminProjectsOverview
      responses:
        "200": { description: "[{id, name, source_type, iac_path, created_at, owner?, members, pending_changesets, repository?{full_name, folder, default_branch, second_reviewer, account, connection_status, access_status}}]. access_status is ok or needs_attention (the owner lost access on GitHub, D-061)." }
        "403": { description: Needs the admin role }
  /admin/users/{oid}/status:
    post:
      summary: Approve, reject, suspend or reactivate a person (admin; M2)
      description: "Allowed changes: pending to active or rejected, active to suspended, suspended or rejected to active. Rejecting or suspending ends the person's sessions at once. An admin cannot change their own status. Audited as user.approve, user.reject, user.suspend or user.reactivate."
      operationId: setUserStatus
      parameters:
        - { name: oid, in: path, required: true, schema: { type: string }, description: "github:<numeric id> or the Entra object id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, rejected, suspended] }
                reason: { type: string, maxLength: 200 }
              required: [status]
      responses:
        "200": { description: "{status}" }
        "400": { description: The reason is too long }
        "404": { description: No such user }
        "409": { description: That change is not allowed from the current status, or it is the admin's own account }
  /admin/users:
    get:
      summary: Everyone who has signed in, with their project count (admin)
      operationId: listUsers
      responses:
        "200":
          description: Users, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "403": { description: Needs the admin role }
  /admin/catalog/modules:
    get:
      summary: Every module version, including deprecated ones (admin)
      operationId: adminListModules
      responses:
        "200":
          description: Modules, by name then newest version first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleRow" }
        "403": { description: Needs the admin role }
    post:
      summary: Import a module schema and publish it (admin)
      description: Validates first. A published version is immutable, so importing the same name and version with different content is a 409; identical content is a no-op.
      operationId: importModule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "200": { description: The same schema was already published (status unchanged) }
        "400": { description: Body is not JSON, or the schema is missing or larger than 1 MB }
        "403": { description: Needs the admin role }
        "409": { description: That version is already published with different content }
        "422": { description: The schema has errors; the result carries the full report }
  /admin/catalog/validate:
    post:
      summary: Check a module schema without saving it (admin)
      description: Always 200 with a report, so every problem shows at once together with what an import would change.
      operationId: validateModule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCheck" }
        "400": { description: Body is not JSON, or the schema is missing or too large }
        "403": { description: Needs the admin role }
  /admin/catalog/modules/{name}/{version}:
    patch:
      summary: Publish or deprecate a module version (admin)
      description: A deprecated version disappears from the catalog developers use but stays readable for drafts and changesets that already reference it.
      operationId: setModuleStatus
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [published, deprecated] }
              required: [status]
      responses:
        "200": { description: Updated }
        "400": { description: Unknown status }
        "403": { description: Needs the admin role }
        "404": { description: Module version not found }
  /projects/{id}/catalog:
    get:
      summary: The modules a project sees (D-060)
      description: >
        The global catalog plus the project's own modules, as module summaries with `scope`.
        A name the project has comes from the project only; such a summary has `shadows_global: true`
        when the global catalog has the same name. `GET /catalog` stays the global catalog alone.
      operationId: listProjectCatalog
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Module summaries, each with scope (global or project)" }
        "404": { description: Not a member of the project }
  /projects/{id}/catalog/{name}/{version}:
    get:
      summary: One module with its schema, as the project sees it
      operationId: getProjectCatalogModule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The module }
        "404": { description: "Not found (also a global version of a name the project owns)" }
  /projects/{id}/catalog/modules:
    get:
      summary: Every version of the project's own modules (owner, co-owner)
      operationId: listProjectModules
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Module versions, newest first within a name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ModuleRow" } }
        "403": { description: Needs the owner or co-owner role of the project }
    post:
      summary: Publish a module schema to the project's own catalog (owner, co-owner)
      description: >
        Same rules as `POST /admin/catalog/modules`. In addition the name must not be one of the
        global catalog (422 with an issue of code `global_name`), unless the project already owns that name.
      operationId: importProjectModule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200": { description: Identical version already published }
        "201": { description: Imported }
        "403": { description: Needs the owner or co-owner role of the project }
        "409": { description: That version exists with different content }
        "422": { description: The schema has errors, or the name belongs to the global catalog }
  /projects/{id}/catalog/validate:
    post:
      summary: Check a module schema against the project's catalog without saving it (owner, co-owner)
      operationId: validateProjectModule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCheck" }
        "403": { description: Needs the owner or co-owner role of the project }
  /projects/{id}/catalog/modules/{name}/{version}:
    patch:
      summary: Publish or deprecate a version of the project's own module (owner, co-owner)
      operationId: setProjectModuleStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [published, deprecated] }
              required: [status]
      responses:
        "200": { description: Updated }
        "403": { description: Needs the owner or co-owner role of the project }
        "404": { description: Not a version of this project's catalog }
  /projects/{id}/catalog/draft:
    post:
      summary: Draft a schema from the text of a variables.tf (owner, co-owner)
      description: Reads only the text sent and stores nothing. `POST /admin/catalog/draft` is the same for an admin.
      operationId: draftProjectSchema
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemaDraftRequest" }
      responses:
        "200":
          description: A draft schema and notes on what a person still has to decide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaDraft" }
        "400": { description: "Bad name, text that is not Terraform, or no variable block" }
        "403": { description: Needs the owner or co-owner role of the project }
  /admin/catalog/draft:
    post:
      summary: Draft a schema from the text of a variables.tf (admin)
      operationId: draftSchema
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemaDraftRequest" }
      responses:
        "200":
          description: A draft schema and notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaDraft" }
        "400": { description: "Bad name, text that is not Terraform, or no variable block" }
        "403": { description: Needs the admin role }
  /projects/{id}/catalog/resources:
    get:
      summary: The raw resource templates a project sees (D-060)
      description: The global templates plus the project's own, each with `scope`; a name the project has comes from the project.
      operationId: listProjectRawResources
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Templates, each with scope (global or project)" }
    post:
      summary: Add a raw resource template to the project (owner, co-owner)
      operationId: createProjectRawResource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawResourceInput" }
      responses:
        "201": { description: Created }
        "400": { description: Invalid template }
        "403": { description: Needs the owner or co-owner role of the project }
        "409": { description: "The name is taken, in the project or in the global catalog" }
  /projects/{id}/catalog/resources/{name}:
    put:
      summary: Replace a template of the project (owner, co-owner)
      operationId: updateProjectRawResource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawResourceInput" }
      responses:
        "200": { description: Saved }
        "403": { description: Needs the owner or co-owner role of the project }
        "404": { description: Not a template of this project }
    delete:
      summary: Delete a template of the project (owner, co-owner)
      operationId: deleteProjectRawResource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Needs the owner or co-owner role of the project }
        "404": { description: Not a template of this project }
  /projects/{id}/changesets/{csId}/revise:
    post:
      summary: Open a published, approved or rejected changeset as a new editable draft
      description: The copy keeps the source canvas as its base, so the preview can colour added / changed / removed lines. The original is untouched. 409 if the changeset is already a draft.
      operationId: reviseChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: "{id} of the new draft" }
        "404": { description: Not found }
        "409": { description: Already a draft }
  /projects/{id}/changesets/{csId}/review:
    get:
      summary: Review detail - canvas diff, HCL diff and the branch that approval would create
      operationId: reviewChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Review detail }
        "409": { description: Changeset is still a draft }
  /projects/{id}/changesets/{csId}/approve:
    post:
      summary: Approve (devops only) - generate .tf and create a branch with one commit
      description: Phase 5 writes to a local git repo instead of ADO. 409 if not published, branch exists, or a generated file already exists.
      operationId: approveChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{status, branch, commit, repo}" }
        "403": { description: Not devops, or separation of duties }
        "409": { description: Not in the published state, or branch/file conflict }
  /projects/{id}/changesets/{csId}/reject:
    post:
      summary: Reject (devops, or the project's owner and co-owners) - a reason is required
      operationId: rejectChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "200": { description: Rejected }
        "400": { description: Missing reason }
        "403": { description: Not devops, or separation of duties }
        "409": { description: Not in the published state }
  /projects/{id}/audit:
    get:
      summary: Audit log for the project (newest first)
      operationId: listAudit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: Audit entries }
  /auth/providers:
    get:
      summary: "Which sign-in buttons the login page shows (served at /auth/providers, outside /api; no sign-in needed)"
      operationId: authProviders
      responses:
        "200": { description: "{providers: [{id: github|entra, label, href}]}" }
  /auth/github/login:
    get:
      summary: "Sign in with GitHub (served at /auth/github/login): sets state and PKCE cookies and redirects to GitHub"
      operationId: githubLogin
      responses:
        "302": { description: Redirect to GitHub }
  /auth/github/callback:
    get:
      summary: "Return from GitHub sign-in (served at /auth/github/callback). Checks state and PKCE, reads the account (identity github:<numeric id>), applies the sign-up policy and redirects to /, or to /?signin=state|denied|code|github|error|rejected|suspended|full|not_invited"
      operationId: githubLoginCallback
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the screens }
  /github/status:
    get:
      summary: Is GitHub set up, and where to install the App (Phase 8, 8.1)
      operationId: githubStatus
      responses:
        "200": { description: "{configured, install_url?, project_source} where project_source is github or local (TF_PROJECT_SOURCE): how this server creates projects" }
  /github/authorize:
    get:
      summary: Send the browser to GitHub to authorize the App (layer 2). Sets a short anti-forgery cookie.
      operationId: githubAuthorize
      responses:
        "302": { description: Redirect to GitHub }
        "409": { description: GitHub is not configured on this server }
  /github/callback:
    get:
      summary: Return from GitHub. Checks the state, asks GitHub which installations and repositories the user can reach, saves short-lived grants (no token is kept) and redirects to the screen with connected=N or error=code.
      operationId: githubCallback
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect to /#/projects/new?connected=N or ?error=state|denied|code|github|server|not_allowed|no_installation" }
        "409": { description: GitHub is not configured on this server }
  /github/connections:
    get:
      summary: The GitHub accounts the caller connected, with project counts and how many repositories GitHub confirmed just now (M1b)
      operationId: myGithubConnections
      responses:
        "200": { description: "[{id, account, account_type, status, projects, repositories, expires_at?}]" }
        "409": { description: This server does not create projects from GitHub }
  /github/connections/{id}/disconnect:
    post:
      summary: Disconnect a connection the caller created, while no project uses it (an admin can force it)
      operationId: disconnectMyGithubConnection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{status: disconnected}" }
        "404": { description: Not found, or not the caller's connection }
        "409": { description: Projects still use it }
  /github/init:
    post:
      summary: Create the first commit (README.md) of a repository that has no commit, after the user confirmed it (D-056)
      operationId: initGithubRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connection_id: { type: string, format: uuid }
                repo_id: { type: string }
              required: [connection_id, repo_id]
      responses:
        "201": { description: "{commit}" }
        "403": { description: No live grant for this repository }
        "409": { description: The repository already has commits }
  /github/repos:
    get:
      summary: Repositories the signed-in user may connect right now (live grants of active connections)
      operationId: githubRepos
      description: "409 when this server creates projects from local folders (project_source=local), as for /github/authorize, /github/folders and /projects/from-repo."
      responses:
        "200": { description: "[{connection_id, account, repo_id, full_name, default_branch, private}]" }
  /github/folders:
    get:
      summary: Folders of a granted repository that hold Terraform (for the folder picker)
      operationId: githubFolders
      parameters:
        - { name: connection_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: repo_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{folders: [path], default_branch}" }
        "403": { description: No live grant for this user and repository; authorize again }
        "409": { description: The connection is not active }
  /projects/from-repo:
    post:
      summary: Create a project from a granted repository; the caller becomes its owner
      operationId: createProjectFromRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                connection_id: { type: string, format: uuid }
                repo_id: { type: string }
                folder: { type: string, description: "Relative folder; empty means the repository root" }
                new_folder: { type: boolean, description: "Start in a folder that holds no Terraform yet (it need not exist; the first publish creates it on a branch). The repository must have commits." }
              required: [name, connection_id, repo_id]
      responses:
        "201": { description: The project (source_type github) }
        "403": { description: No live grant for this repository }
        "409": { description: "Name taken, or the connection is not active" }
        "422": { description: "Unsafe or missing folder, no .tf files in it (or, with new_folder, Terraform already there), or the repository is empty (no commits yet)" }
  /projects/{id}/generation:
    get:
      summary: "The project's variables, default layout and starter files (any member; D-057)"
      operationId: getProjectGeneration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{layout{mode,folder,file,files}, variables[{name,description,values{env:value}}], starters[{filename,content}]}" }
    put:
      summary: Replace them (owner, co-owner or admin). The whole document is validated; nothing is stored when anything is wrong.
      operationId: putProjectGeneration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The stored document }
        "403": { description: Needs the owner or co-owner role }
        "422": { description: "{error, problems[]}: every problem found" }
  /projects/{id}/team:
    get:
      summary: Members with roles, the caller's role and the second-reviewer switch
      operationId: getTeam
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{members, my_role, second_reviewer, repository?, folder?, repository_access?}. repository_access is ok or needs_attention: GitHub says the owner can no longer reach the repository, and the project reads and writes nothing until the owner verifies again (D-061)." }
    post:
      summary: Add a person who has signed in (by email or id), or change their role. Owner and co-owner.
      operationId: inviteMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user: { type: string }
                role: { type: string, enum: [co_owner, contributor], default: contributor }
              required: [user]
      responses:
        "200": { description: The team }
        "403": { description: Needs owner or co-owner }
        "422": { description: That person has not signed in yet }
  /projects/{id}/team/{oid}:
    patch:
      summary: Change a member's role (never to or from owner)
      operationId: setMemberRole
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: oid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [co_owner, contributor] }
              required: [role]
      responses:
        "200": { description: The team }
        "409": { description: "The owner's role cannot be changed; transfer ownership" }
    delete:
      summary: Remove a member (never the owner)
      operationId: removeMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: oid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "409": { description: The owner cannot be removed }
  /projects/{id}/settings:
    put:
      summary: Per-project switch "require a second reviewer" (owner and co-owner; GitHub projects)
      operationId: setProjectSettings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                second_reviewer: { type: boolean }
              required: [second_reviewer]
      responses:
        "200": { description: The team }
        "409": { description: The project has no GitHub repository }
  /projects/{id}/transfer:
    post:
      summary: Transfer ownership to a member (owner only); the old owner becomes co-owner
      operationId: transferOwnership
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string }
              required: [to]
      responses:
        "200": { description: The team }
        "403": { description: Owner only }
        "422": { description: The new owner must already be a member }
  /admin/connections:
    get:
      summary: Every GitHub connection with the number of projects using it (admin)
      operationId: listConnections
      responses:
        "200": { description: "[{id, provider, account_login, account_type, status, created_by, created_at, projects}]" }
  /admin/connections/{id}/disconnect:
    post:
      summary: Disconnect; projects that use it stop reading and branching (admin)
      operationId: disconnectConnection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{status}" }
  /admin/connections/{id}/recheck:
    post:
      summary: Ask GitHub whether the installation still exists; marks it active or needs_attention (admin)
      operationId: recheckConnection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{status}" }
components:
  schemas:
    Changeset:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        env: { type: string }
        user_oid: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, saved, published, approved, rejected] }
        canvas: { $ref: "#/components/schemas/CanvasState" }
        reject_reason: { type: string, nullable: true }
        reviewer_oid: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        base_canvas: { $ref: "#/components/schemas/CanvasState", nullable: true }
        branch_name: { type: string, nullable: true }
        commit_sha: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CanvasState:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CanvasNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/CanvasEdge" }
    CanvasNode:
      type: object
      properties:
        id: { type: string }
        module_name: { type: string }
        module_version: { type: string }
        instance_name: { type: string }
        target_folder: { type: string }
        values: { type: object }
        position_x: { type: number }
        position_y: { type: number }
        parent_id: { type: string, description: Container node this one sits in. }
        nest_field: { type: string, description: When set, the node is folded into the parent module input map (e.g. subnets) instead of becoming a module call. }
        color: { type: string, description: Container colour key. }
        filename: { type: string, description: The .tf file this resource is written to (default main.tf). }
        kind: { type: string, enum: [module, resource], description: "resource = a raw provider resource written as a resource block (D-040). Absent = module." }
        resource_type: { type: string, description: "Raw resources only, e.g. azurerm_resource_group." }
        existing:
          type: object
          description: Set when the node edits a module call that is already in the repository; only that block is replaced (D-036).
          properties:
            folder: { type: string }
            filename: { type: string }
            label: { type: string }
          required: [folder, filename, label]
    CanvasEdge:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        kind: { type: string }
    GenerateOutput:
      type: object
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/GeneratedFile" }
    GeneratedFile:
      type: object
      properties:
        folder: { type: string }
        filename: { type: string }
        content: { type: string }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        iac_path: { type: string }
        source_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RawResourceInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: "2-63 chars: lowercase letters, digits and '-'. Ignored on PUT (taken from the path)." }
        title: { type: string, maxLength: 80 }
        resource_type: { type: string, description: "e.g. azurerm_resource_group" }
        description: { type: string, maxLength: 500 }
        default_values: { type: object, description: "Starting arguments; {\"$expr\": ...} for references, {\"$blocks\": [...]} for nested blocks." }
        target_folder: { type: string, description: Optional default folder. }
      required: [name, title, resource_type]
    RawResource:
      allOf:
        - { $ref: "#/components/schemas/RawResourceInput" }
        - type: object
          properties:
            updated_by: { type: string }
            updated_at: { type: string, format: date-time }
            scope: { type: string, enum: [global, project], description: "Whose template it is (D-060)." }
            shadows_global: { type: boolean, description: "A project template whose name a global one also has." }
    Member:
      type: object
      properties:
        user_oid: { type: string }
        email: { type: string }
        name: { type: string }
        added_by: { type: string }
        created_at: { type: string, format: date-time }
    UserSummary:
      type: object
      properties:
        oid: { type: string }
        email: { type: string }
        name: { type: string }
        project_count: { type: integer }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
        provider: { type: string, description: "github or entra" }
        login: { type: string, description: "Display only, never an identifier" }
        status: { type: string, enum: [pending, active, rejected, suspended] }
        status_reason: { type: string }
    ComponentConfig:
      type: object
      properties:
        address: { type: string }
        color: { type: string }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    ModuleRow:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        title: { type: string }
        status: { type: string, enum: [published, deprecated] }
        target_folder: { type: string }
        imported_by: { type: string }
        checksum: { type: string }
        updated_at: { type: string, format: date-time }
    SchemaDraftRequest:
      type: object
      additionalProperties: false
      required: [name, variables]
      properties:
        name: { type: string, description: The catalog name the draft is for }
        variables: { type: string, description: The text of a variables.tf }
    SchemaDraft:
      type: object
      properties:
        schema: { type: object, description: A module schema that passes validation }
        notes: { type: array, items: { type: string } }
    ImportRequest:
      type: object
      properties:
        name: { type: string, description: "Catalog name: 2-63 chars, lowercase letters, digits and '-'." }
        schema: { type: object, description: The module's JSON Schema with x-tf-module metadata. }
      required: [name, schema]
    Issue:
      type: object
      properties:
        path: { type: string, description: JSON pointer to the offending part of the schema. }
        code: { type: string }
        message: { type: string }
    ValidationReport:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        name: { type: string }
        version: { type: string }
        title: { type: string }
        description: { type: string }
        icon: { type: string }
        target_folder: { type: string }
        checksum: { type: string }
    SchemaChange:
      type: object
      properties:
        kind: { type: string, enum: [added, removed, changed] }
        path: { type: string }
        detail: { type: string }
        breaking: { type: boolean }
    ImportCheck:
      type: object
      properties:
        report: { $ref: "#/components/schemas/ValidationReport" }
        exists: { type: string, enum: [none, identical, different] }
        compared_to: { type: string, description: Version the changes are measured against. }
        changes: { type: array, items: { $ref: "#/components/schemas/SchemaChange" } }
        breaking_changes: { type: integer }
    ImportResult:
      type: object
      properties:
        status: { type: string, enum: [imported, unchanged] }
        result: { $ref: "#/components/schemas/ImportCheck" }
