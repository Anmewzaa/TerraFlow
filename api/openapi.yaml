openapi: 3.1.0
info:
  title: TerraFlow API
  version: 0.6.0
  description: >
    Contract between the TerraFlow Go backend and the React frontend. Source of
    truth: the Go server and the TS client are generated from this file.
servers:
  - url: /api
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
  /projects/{id}/changesets:
    get:
      summary: List changesets for a project
      operationId: listChangesets
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Changeset" }
    post:
      summary: Create a new draft changeset
      operationId: createChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                env: { type: string }
                title: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
  /projects/{id}/changesets/{csId}:
    get:
      summary: Get a changeset
      operationId: getChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changeset" }
    put:
      summary: Save changeset canvas (auto-save)
      operationId: saveChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanvasState" }
      responses:
        "200":
          description: Saved
    delete:
      summary: Delete a draft changeset
      operationId: deleteChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
  /projects/{id}/changesets/{csId}/publish:
    post:
      summary: Publish a changeset for review
      operationId: publishChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
              required: [title]
      responses:
        "200":
          description: Published
        "409":
          description: Another changeset of this project is still waiting for review; decide it first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  pending:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
  /projects/{id}/changesets/{csId}/preview:
    get:
      summary: Preview generated HCL for a changeset
      operationId: previewChangeset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: csId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Generated HCL files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateOutput" }
  /projects:
    get:
      summary: Projects the signed-in user can open
      description: Admins (Entra devops group) see every project; everyone else sees only the projects an admin assigned to them (D-032).
      operationId: listProjects
      responses:
        "200":
          description: Projects, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      summary: Create a project (admin)
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                iac_path:
                  type: string
                  description: Optional existing folder inside the server workspace. Omitted = create workspace/<slug>.
              required: [name]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { description: Invalid name, description or iac_path outside the workspace }
        "403": { description: Needs the admin role }
        "409": { description: A project with this name already exists }
  /projects/{id}:
    patch:
      summary: Rename or re-describe a project, or change its folder (admin)
      description: The slug never changes, so branch names and links stay stable.
      operationId: updateProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                iac_path: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { description: Invalid field, or nothing to update }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
    delete:
      summary: Delete a project from the app (admin)
      description: Removes the project, its drafts, changesets and member list. Repository files and the audit log are kept. Changesets waiting for review make this a 409 unless force=true.
      operationId: deleteProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
        "409":
          description: Changesets are waiting for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  pending_changesets: { type: integer }
  /projects/{id}/import:
    get:
      summary: Module calls already in the project, as canvas nodes
      description: Read-only. Each node carries `existing` (folder, file, label) so editing it replaces only that block (D-036). Literal arguments come back as values; references such as var.x or module.a.id come back as `{"$expr": "<text>"}` so they are not frozen into literals when the node is edited.
      operationId: importProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The module calls found
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/CanvasNode" }
        "404": { description: Unknown project, or not a member }
        "422": { description: A .tf file in the project does not parse }
  /projects/{id}/members:
    get:
      summary: Users assigned to the project (admin)
      operationId: listMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Members, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
    put:
      summary: Replace the project's member list (admin)
      description: All-or-nothing. A user must have signed in once before they can be assigned.
      operationId: setMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_oids: { type: array, items: { type: string } }
              required: [user_oids]
      responses:
        "200":
          description: The new member list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "400": { description: Missing or empty user_oids value }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
        "422": { description: A user has never signed in }
  /projects/{id}/component-config:
    get:
      summary: App-side settings (such as colours) of the project's components
      operationId: listComponentConfig
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Settings, by address
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComponentConfig" }
        "404": { description: Not found or not a member }
    put:
      summary: Set or clear one component's colour
      description: An empty color removes the setting.
      operationId: setComponentConfig
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                address: { type: string, description: "<folder>/<module label>" }
                color: { type: string, description: Short lowercase colour key, or empty to clear. }
              required: [address, color]
      responses:
        "200": { description: Saved }
        "400": { description: Invalid address or colour }
        "404": { description: Not found or not a member }
  /catalog/resources:
    get:
      summary: Raw resources an admin prepared (D-041)
      description: A raw resource is a plain `resource` block such as azurerm_resource_group, not a module. Developers place it on the canvas; its default values are only a starting point.
      operationId: listRawResources
      responses:
        "200":
          description: Templates, by title
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RawResource" }
  /admin/resources:
    post:
      summary: Add a raw resource (admin)
      operationId: createRawResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawResourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawResource" }
        "400": { description: Invalid name, title, resource_type, folder or body }
        "403": { description: Needs the admin role }
        "409": { description: A raw resource with this name already exists }
  /admin/resources/{name}:
    put:
      summary: Replace a raw resource's fields (admin); the name never changes
      operationId: updateRawResource
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawResourceInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawResource" }
        "400": { description: Invalid field or body }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
    delete:
      summary: Delete a raw resource (admin)
      description: Nodes already on a canvas keep working; they carry their own type and values.
      operationId: deleteRawResource
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Needs the admin role }
        "404": { description: Not found }
  /dev/users:
    get:
      summary: Local sign-in only (auth disabled) - who can be picked and who is signed in
      description: 404 when the local sign-in is off. POST /dev/login {oid} sets the cookie, POST /dev/logout clears it; without the cookie every other call is 401.
      operationId: listDevUsers
      responses:
        "200": { description: "{enabled, current, users[{oid,email,name,role,note}]}" }
        "404": { description: The local sign-in is not on }
  /admin/audit:
    get:
      summary: Everything that was done, across projects and module management (admin)
      operationId: listAuditAll
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 500 } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    user_oid: { type: string }
                    action: { type: string }
                    resource: { type: string }
                    detail: { type: object }
                    created_at: { type: string, format: date-time }
        "403": { description: Needs the admin role }
  /admin/users:
    get:
      summary: Everyone who has signed in, with their project count (admin)
      operationId: listUsers
      responses:
        "200":
          description: Users, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "403": { description: Needs the admin role }
  /admin/catalog/modules:
    get:
      summary: Every module version, including deprecated ones (admin)
      operationId: adminListModules
      responses:
        "200":
          description: Modules, by name then newest version first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleRow" }
        "403": { description: Needs the admin role }
    post:
      summary: Import a module schema and publish it (admin)
      description: Validates first. A published version is immutable, so importing the same name and version with different content is a 409; identical content is a no-op.
      operationId: importModule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "200": { description: The same schema was already published (status unchanged) }
        "400": { description: Body is not JSON, or the schema is missing or larger than 1 MB }
        "403": { description: Needs the admin role }
        "409": { description: That version is already published with different content }
        "422": { description: The schema has errors; the result carries the full report }
  /admin/catalog/validate:
    post:
      summary: Check a module schema without saving it (admin)
      description: Always 200 with a report, so every problem shows at once together with what an import would change.
      operationId: validateModule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCheck" }
        "400": { description: Body is not JSON, or the schema is missing or too large }
        "403": { description: Needs the admin role }
  /admin/catalog/modules/{name}/{version}:
    patch:
      summary: Publish or deprecate a module version (admin)
      description: A deprecated version disappears from the catalog developers use but stays readable for drafts and changesets that already reference it.
      operationId: setModuleStatus
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [published, deprecated] }
              required: [status]
      responses:
        "200": { description: Updated }
        "400": { description: Unknown status }
        "403": { description: Needs the admin role }
        "404": { description: Module version not found }
  /projects/{id}/changesets/{csId}/revise:
    post:
      summary: Open a published, approved or rejected changeset as a new editable draft
      description: The copy keeps the source canvas as its base, so the preview can colour added / changed / removed lines. The original is untouched. 409 if the changeset is already a draft.
      operationId: reviseChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: "{id} of the new draft" }
        "404": { description: Not found }
        "409": { description: Already a draft }
  /projects/{id}/changesets/{csId}/review:
    get:
      summary: Review detail - canvas diff, HCL diff and the branch that approval would create
      operationId: reviewChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Review detail }
        "409": { description: Changeset is still a draft }
  /projects/{id}/changesets/{csId}/approve:
    post:
      summary: Approve (devops only) - generate .tf and create a branch with one commit
      description: Phase 5 writes to a local git repo instead of ADO. 409 if not published, branch exists, or a generated file already exists.
      operationId: approveChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{status, branch, commit, repo}" }
        "403": { description: Not devops, or separation of duties }
        "409": { description: Not in the published state, or branch/file conflict }
  /projects/{id}/changesets/{csId}/reject:
    post:
      summary: Reject (devops only) - a reason is required
      operationId: rejectChangeset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: csId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "200": { description: Rejected }
        "400": { description: Missing reason }
        "403": { description: Not devops, or separation of duties }
        "409": { description: Not in the published state }
  /projects/{id}/audit:
    get:
      summary: Audit log for the project (newest first)
      operationId: listAudit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: Audit entries }
components:
  schemas:
    Changeset:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        env: { type: string }
        user_oid: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, published, approved, rejected] }
        canvas: { $ref: "#/components/schemas/CanvasState" }
        reject_reason: { type: string, nullable: true }
        reviewer_oid: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        base_canvas: { $ref: "#/components/schemas/CanvasState", nullable: true }
        branch_name: { type: string, nullable: true }
        commit_sha: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CanvasState:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CanvasNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/CanvasEdge" }
    CanvasNode:
      type: object
      properties:
        id: { type: string }
        module_name: { type: string }
        module_version: { type: string }
        instance_name: { type: string }
        target_folder: { type: string }
        values: { type: object }
        position_x: { type: number }
        position_y: { type: number }
        parent_id: { type: string, description: Container node this one sits in. }
        nest_field: { type: string, description: When set, the node is folded into the parent module input map (e.g. subnets) instead of becoming a module call. }
        color: { type: string, description: Container colour key. }
        filename: { type: string, description: The .tf file this resource is written to (default main.tf). }
        kind: { type: string, enum: [module, resource], description: "resource = a raw provider resource written as a resource block (D-040). Absent = module." }
        resource_type: { type: string, description: "Raw resources only, e.g. azurerm_resource_group." }
        existing:
          type: object
          description: Set when the node edits a module call that is already in the repository; only that block is replaced (D-036).
          properties:
            folder: { type: string }
            filename: { type: string }
            label: { type: string }
          required: [folder, filename, label]
    CanvasEdge:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        kind: { type: string }
    GenerateOutput:
      type: object
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/GeneratedFile" }
    GeneratedFile:
      type: object
      properties:
        folder: { type: string }
        filename: { type: string }
        content: { type: string }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        iac_path: { type: string }
        source_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RawResourceInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: "2-63 chars: lowercase letters, digits and '-'. Ignored on PUT (taken from the path)." }
        title: { type: string, maxLength: 80 }
        resource_type: { type: string, description: "e.g. azurerm_resource_group" }
        description: { type: string, maxLength: 500 }
        default_values: { type: object, description: "Starting arguments; {\"$expr\": ...} for references, {\"$blocks\": [...]} for nested blocks." }
        target_folder: { type: string, description: Optional default folder. }
      required: [name, title, resource_type]
    RawResource:
      allOf:
        - { $ref: "#/components/schemas/RawResourceInput" }
        - type: object
          properties:
            updated_by: { type: string }
            updated_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        user_oid: { type: string }
        email: { type: string }
        name: { type: string }
        added_by: { type: string }
        created_at: { type: string, format: date-time }
    UserSummary:
      type: object
      properties:
        oid: { type: string }
        email: { type: string }
        name: { type: string }
        project_count: { type: integer }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    ComponentConfig:
      type: object
      properties:
        address: { type: string }
        color: { type: string }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    ModuleRow:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        title: { type: string }
        status: { type: string, enum: [published, deprecated] }
        target_folder: { type: string }
        imported_by: { type: string }
        checksum: { type: string }
        updated_at: { type: string, format: date-time }
    ImportRequest:
      type: object
      properties:
        name: { type: string, description: "Catalog name: 2-63 chars, lowercase letters, digits and '-'." }
        schema: { type: object, description: The module's JSON Schema with x-tf-module metadata. }
      required: [name, schema]
    Issue:
      type: object
      properties:
        path: { type: string, description: JSON pointer to the offending part of the schema. }
        code: { type: string }
        message: { type: string }
    ValidationReport:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/Issue" } }
