replicaCount: 1

image:
  # Published by .github/workflows/image.yml. For a local build use
  # `--set image.repository=terraflow --set image.tag=local`.
  repository: ghcr.io/anmewzaa/terraflow
  tag: "0.1.1"
  pullPolicy: IfNotPresent
  # Name of an image pull Secret, only needed while the ghcr package is private.
  pullSecret: ""

# A Postgres that lives in the same release, for local and demo clusters. Not for
# production, which uses Entra (passwordless) auth against a managed Postgres: set
# postgres.enabled=false and point env.TF_PG_* at it.
postgres:
  enabled: true
  image: postgres:16-alpine
  database: terraflow
  user: terraflow
  # The password goes in a Secret; leave blank to generate one that survives upgrades.
  password: ""
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

persistence:
  # Keeps /workspace across pod restarts and upgrades.
  enabled: true
  size: 1Gi

github:
  # Name of a Secret you create yourself (see README) with the keys `private-key.pem` (the
  # GitHub App's private key) and, for user authorization, `client-secret`. Empty = GitHub off.
  # The other App settings are plain values under env: TF_GITHUB_APP_ID, TF_GITHUB_APP_SLUG,
  # TF_GITHUB_APP_CLIENT_ID, TF_GITHUB_REDIRECT_URI, TF_GITHUB_ALLOWED_OWNERS.
  existingSecret: ""

service:
  type: ClusterIP
  port: 8080

env:
  TF_ADDR: ":8080"
  # Used only when postgres.enabled=false; otherwise the bundled Postgres is wired in.
  TF_PG_HOST: "host.docker.internal"
  TF_PG_PORT: "5432"
  TF_PG_DATABASE: "terraflow"
  TF_PG_USER: "terraflow"
  TF_PG_PASSWORD: "localdev"
  TF_SESSION_KEY: "local-dev-session-key-32bytes!!"
  TF_AUTH_DISABLED: "true"
  TF_DEV_USER_ROLE: "devops"
  TF_INSECURE_COOKIES: "true"
  TF_SEED: "true"
  TF_SAMPLE_DIR: "/samples/iac/AIC"

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
