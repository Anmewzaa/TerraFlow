replicaCount: 1

image:
  # Published by .github/workflows/image.yml. For a local build use
  # `--set image.repository=terraflow --set image.tag=local`.
  repository: ghcr.io/anmewzaa/terraflow
  tag: "1.0.1"
  pullPolicy: IfNotPresent
  # Name of an image pull Secret, only needed while the ghcr package is private.
  pullSecret: ""

# A Postgres that lives in the same release, for local and demo clusters. Not for
# production, which uses Entra (passwordless) auth against a managed Postgres: set
# postgres.enabled=false and point env.TF_PG_* at it.
postgres:
  enabled: true
  image: postgres:16-alpine
  database: terraflow
  user: terraflow
  # The password goes in a Secret; leave blank to generate one that survives upgrades.
  password: ""
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

persistence:
  # Keeps /workspace across pod restarts and upgrades.
  enabled: true
  size: 1Gi

# The version that also signs people in with GitHub and keeps projects on GitHub repositories. Off = the local
# version: made-up users to pick from, no GitHub. See values-local.yaml and values-github.yaml.
github:
  enabled: false
  # The GitHub App (create it first, see the README). These are not secret.
  appId: ""
  appSlug: ""
  clientId: ""
  # Both callback URLs must be added to the App. The first is for connecting a repository, the second for sign-in
  # (it defaults to the host of redirectUri).
  redirectUri: ""            # https://terraflow.example.com/api/github/callback
  loginRedirectUri: ""       # https://terraflow.example.com/auth/github/callback
  # Accounts that may install the App; empty = any.
  allowedOwners: ""
  # Administrators: github:<numeric id>, comma separated. Empty = nobody is admin until you set it.
  adminUsers: ""
  signupMode: approval       # approval | open | invite_only
  # true only for plain http (for example a port-forward on localhost); real use is https.
  insecureCookies: false
  # A Secret you create (see the README) with `private-key.pem` and `client-secret`.
  existingSecret: ""

# Signs session cookies. Blank = generated once and kept (a Secret named <release>-app).
sessionKey: ""

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

env:
  TF_ADDR: ":8080"
  # Used only when postgres.enabled=false; otherwise the bundled Postgres is wired in.
  TF_PG_HOST: "host.docker.internal"
  TF_PG_PORT: "5432"
  TF_PG_DATABASE: "terraflow"
  TF_PG_USER: "terraflow"
  TF_PG_PASSWORD: "localdev"
  TF_AUTH_DISABLED: "true"
  # Pick a made-up user on the sign-in page (development only; needs TF_AUTH_DISABLED).
  TF_DEV_LOGIN: "true"
  TF_DEV_USER_ROLE: "devops"
  TF_INSECURE_COOKIES: "true"
  TF_SEED: "true"
  TF_SAMPLE_DIR: "/samples/iac/AIC"

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
