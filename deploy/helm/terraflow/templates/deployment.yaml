apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  strategy:
    type: Recreate # a ReadWriteOnce volume cannot be mounted by the old and the new pod at once
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "terraflow.pgName" . }} -p 5432 -U {{ .Values.postgres.user }}; do sleep 2; done"]
      {{- end }}
      # The image runs as UID 65532; fsGroup lets it write the workspace volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terraflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            # The key that signs session cookies is a Secret, never in the ConfigMap.
            - name: TF_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-app
                  key: session-key
            {{- if .Values.postgres.enabled }}
            - name: TF_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "terraflow.pgName" . }}
                  key: password
            {{- end }}
            {{- if .Values.github.enabled }}
            # The GitHub App's private key is a file from the Secret; the client secret signs people in with GitHub.
            # Neither is ever in the ConfigMap.
            - name: TF_GITHUB_APP_PRIVATE_KEY_FILE
              value: /etc/terraflow/github/private-key.pem
            - name: TF_GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "github.existingSecret is required when github.enabled (see the README)" .Values.github.existingSecret }}
                  key: client-secret
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- if or .Values.persistence.enabled .Values.github.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: workspace
              mountPath: /workspace
            {{- end }}
            {{- if .Values.github.enabled }}
            - name: github-app
              mountPath: /etc/terraflow/github
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.persistence.enabled .Values.github.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-workspace
        {{- end }}
        {{- if .Values.github.enabled }}
        - name: github-app
          secret:
            secretName: {{ .Values.github.existingSecret }}
            defaultMode: 0440
        {{- end }}
      {{- end }}
