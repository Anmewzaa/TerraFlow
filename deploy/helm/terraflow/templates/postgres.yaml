{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "terraflow.pgName" . }}
  labels:
    app: {{ include "terraflow.pgName" . }}
  annotations:
    # The data volume outlives `helm uninstall`; the password it was created with must too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ include "terraflow.pgPassword" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "terraflow.pgName" . }}
  labels:
    app: {{ include "terraflow.pgName" . }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: {{ include "terraflow.pgName" . }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "terraflow.pgName" . }}
  labels:
    app: {{ include "terraflow.pgName" . }}
spec:
  serviceName: {{ include "terraflow.pgName" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "terraflow.pgName" . }}
  template:
    metadata:
      labels:
        app: {{ include "terraflow.pgName" . }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "terraflow.pgName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
