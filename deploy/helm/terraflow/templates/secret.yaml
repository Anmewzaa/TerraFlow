apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Signing the cookies with a new key would sign everyone out, so the key outlives `helm uninstall`.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  session-key: {{ include "terraflow.sessionKey" . | quote }}
